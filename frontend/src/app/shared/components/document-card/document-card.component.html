<article class="document-card">

  <!-- Delete loader overlay -->
  @if (isDeleting) {
  <div class="delete-overlay">
    <div class="delete-loader">
      <div class="spinner"></div>
      <span>Deleting document...</span>
    </div>
  </div>
  }

  <!-- Card Header -->
  <div class="card-header">

    <div class="file-type-badge">
      PDF
    </div>

    <div class="card-badges">

      <span class="document-type-badge">
        {{ formatDocumentType(document.documentType) }}
      </span>

      <span class="status-badge">
        {{ document.status }}
      </span>

    </div>

  </div>


  <!-- Card Body -->
  <div class="card-body">

    <h3
      class="document-title"
      [title]="document.originalFilename"
    >

      <a
        [routerLink]="['/documents', document.id]"
        class="title-link"
      >
        {{ document.originalFilename }}
      </a>

    </h3>


    <p class="document-meta">

      <span>
        {{ formatFileSize(document.fileSize) }}
      </span>

      <span class="meta-dot">
        •
      </span>

      <span>
        {{ document.createdAt | date:'MMM d, y, h:mm a' }}
      </span>

    </p>


    <div class="document-info-row">

      <div class="document-id-pill">
        Document #{{ document.id }}
      </div>

      <div class="secure-label">
        ✓ Stored securely
      </div>

    </div>

  </div>


  <!-- PDF Actions -->
  <div class="card-actions">

    <button
      type="button"
      class="action-button primary-button"
      [disabled]="isDeleting"
      (click)="view.emit(document)"
    >
      View PDF
    </button>


    <button
      type="button"
      class="action-button secondary-button"
      [disabled]="isDeleting"
      (click)="download.emit(document)"
    >
      Download
    </button>


    <button
      type="button"
      class="action-button delete-button"
      [disabled]="isDeleting"
      (click)="delete.emit(document)"
    >
      @if (isDeleting) {
      Deleting...
      } @else {
      Delete
      }
    </button>

  </div>


  <!-- Analysis Action -->
  <button
    type="button"
    class="analysis-button"
    [disabled]="isDeleting"
    (click)="analyze.emit(document)"
  >
    View Analysis
  </button>

</article>
