services:
  postgres:
    image: postgres:16
    container_name: ai-document-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_document_reader
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: