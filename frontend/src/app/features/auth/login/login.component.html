<!-- src/app/features/auth/login/login.component.html -->

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Sign in to your AI Legal Document Reader</p>
    </div>

    <!-- Bind our form to the TypeScript loginForm variable -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="name@example.com"
          [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        >

        <!-- Modern Angular @if for error handling -->
        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
        <span class="error-text">Please enter a valid email address.</span>
        }
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="••••••••"
          [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >

        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
        <span class="error-text">Password is required.</span>
        }
      </div>

      <!-- Disable the button entirely if the form is mathematically invalid -->
      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid">
        Sign In
      </button>

    </form>
  </div>
</div>
